<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Estudio Stock</title>
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Estudio Stock">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    :root {
      --bg: #fff;
      --text: #111516;
      --muted: #6f767d;
      --line: #e1e4e7;
      --soft: #f5f6f6;
      --teal: #075f5d;
      --amber: #c47a00;
      --danger: #b42318;
      --shadow: 0 16px 34px rgba(4, 47, 46, .2);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f2f3f3;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    button, input, select, textarea { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; cursor: pointer; }
    .phone {
      width: min(100%, 460px);
      min-height: 100vh;
      margin: 0 auto;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(0,0,0,.04);
    }
    .status {
      height: 36px;
      padding: 10px 28px 0;
      display: flex;
      justify-content: space-between;
      font-weight: 850;
      font-size: 15px;
    }
    .status-icons { display: flex; gap: 7px; align-items: center; color: #111; }
    .signal { display: grid; grid-template-columns: repeat(4, 3px); gap: 2px; align-items: end; height: 13px; }
    .signal i { width: 3px; border-radius: 2px; background: currentColor; display: block; }
    .signal i:nth-child(1){height:5px}.signal i:nth-child(2){height:8px}.signal i:nth-child(3){height:11px}.signal i:nth-child(4){height:13px}
    .battery { width: 24px; height: 12px; border: 2px solid currentColor; border-radius: 3px; position: relative; }
    .battery:before { content:""; position:absolute; right:-5px; top:1px; width:2px; height:6px; background:currentColor; border-radius:0 2px 2px 0; }
    .battery:after { content:""; position:absolute; left:2px; top:1px; width:15px; height:6px; background:currentColor; border-radius:1px; }
    .appbar {
      height: 78px;
      display: grid;
      grid-template-columns: 56px 1fr 56px;
      align-items: center;
      padding: 4px 16px 0;
    }
    .title { text-align: center; font-size: 24px; font-weight: 900; line-height: 1; }
    .icon-button {
      width: 46px; height: 46px; border: 0; background: transparent; color: #111;
      display: grid; place-items: center;
    }
    .icon-button svg { width: 26px; height: 26px; stroke-width: 2.2; }
    .tabs {
      height: 76px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-bottom: 1px solid var(--line);
    }
    .tab {
      border: 0;
      background: transparent;
      color: #3b4045;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 760;
      font-size: 14px;
      position: relative;
    }
    .tab svg { width: 20px; height: 20px; stroke-width: 1.9; }
    .tab.active { color: var(--teal); font-weight: 900; }
    .tab.active:after { content:""; position:absolute; left:14px; right:14px; bottom:0; height:3px; background:var(--teal); }
    main { padding: 18px 16px 134px; }
    .search-row { display: grid; grid-template-columns: 1fr 48px; gap: 12px; align-items: center; margin-bottom: 16px; }
    .search-box {
      height: 48px; border: 1px solid #d8dbde; border-radius: 7px;
      display: grid; grid-template-columns: 42px 1fr; align-items: center; padding: 0 10px;
    }
    .search-box svg { width: 24px; height: 24px; stroke-width: 2.1; }
    .search-box input { width: 100%; border: 0; outline: 0; font-size: 16px; background: transparent; }
    .filter-button { width:48px; height:48px; border:1px solid #d8dbde; border-radius:7px; background:white; display:grid; place-items:center; }
    .filter-button svg { width:25px; height:25px; }
    .filter-panel { display:none; grid-template-columns: 1fr; gap:8px; margin:-6px 0 14px; }
    .filter-panel.open { display:grid; }
    .field {
      height: 44px;
      border: 1px solid #d8dbde;
      border-radius: 7px;
      padding: 0 12px;
      background: white;
      color: var(--text);
      width: 100%;
    }
    textarea.field { height: auto; padding-top: 10px; resize: vertical; }
    .toolbar {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .toolbar.hidden { display: none; }
    .primary, .secondary, .danger {
      min-height: 42px;
      border-radius: 8px;
      padding: 0 12px;
      font-weight: 900;
    }
    .primary { border: 0; background: var(--teal); color: white; }
    .secondary { border: 1px solid var(--line); background: white; color: var(--text); }
    .danger { border: 1px solid #f2c5c0; background: #fff5f4; color: var(--danger); }
    .mode-note { color: var(--muted); font-size: 13px; margin: -5px 0 14px; }
    .table-head, .stock-row {
      display: grid;
      grid-template-columns: 34px minmax(128px, 1fr) 50px 52px 74px;
      gap: 7px;
      align-items: center;
    }
    .table-head {
      color: #686d73;
      font-size: 11px;
      font-weight: 850;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .stock-row {
      min-height: 76px;
      border-bottom: 1px solid var(--line);
      padding: 9px 0;
    }
    .check { width: 22px; height: 22px; accent-color: var(--teal); }
    .material { display: grid; grid-template-columns: 52px 1fr; gap: 10px; align-items: center; min-width: 0; }
    .emoji {
      width: 50px; height: 54px; border: 1px solid #dddfe2; border-radius: 7px;
      display: grid; place-items: center; background: #fafafa;
      font-size: 31px;
      font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    }
    .item-name { font-size: 15px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-sub { margin-top: 5px; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stock { color: var(--teal); font-size: 21px; font-weight: 900; text-align:center; }
    .min { text-align:center; font-size:16px; }
    .min.low { color: var(--amber); font-weight:900; }
    .stepper { display:grid; grid-template-columns: 34px 34px; gap: 7px; justify-content:end; }
    .step {
      width: 34px; height: 36px; border: 1.5px solid var(--teal); border-radius: 6px;
      background: white; color: var(--teal); font-size: 25px; line-height: 1; display:grid; place-items:center;
    }
    .cards { display:grid; gap:10px; }
    .card { border:1px solid var(--line); border-radius:8px; padding:12px; background:white; display:grid; gap:10px; }
    .card h2 { margin:0; font-size:16px; line-height:1.2; }
    .card p { margin:4px 0 0; color:var(--muted); font-size:13px; }
    .price-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .price-box { border:1px solid var(--line); border-radius:8px; padding:9px; display:grid; gap:6px; }
    .price-box.best { border-color:var(--teal); background:#eef8f6; }
    .price-box label { color:var(--muted); font-size:12px; font-weight:850; }
    .price-box input { width:100%; border:0; border-bottom:1px solid var(--line); outline:0; font-size:16px; font-weight:850; color:var(--teal); background:transparent; }
    .empty { color: var(--muted); text-align: center; padding: 36px 12px; border-bottom: 1px solid var(--line); }
    .fab-wrap {
      position: fixed; left: 50%; bottom: 94px; width: min(100%, 460px);
      transform: translateX(-50%); padding-right: 25px; display:flex; justify-content:flex-end; align-items:end; gap:8px; pointer-events:none; z-index:4;
    }
    .fab-label { color: var(--teal); font-size: 13px; font-weight: 850; }
    .fab {
      width: 62px; height: 62px; border-radius: 50%; border: 0; color: white;
      background: var(--teal); font-size: 42px; line-height: 1; display:grid; place-items:center; box-shadow: var(--shadow); pointer-events:auto;
    }
    .summary {
      position: fixed; left: 50%; bottom: 0; transform: translateX(-50%);
      width: min(100%, 460px); background:white; border-top:1px solid var(--line);
      display:grid; grid-template-columns:repeat(3,1fr); padding:12px 8px 20px; z-index:3;
    }
    .summary-item { min-height:64px; display:grid; align-content:center; justify-items:center; gap:7px; border-right:1px solid var(--line); text-align:center; }
    .summary-item:last-child { border-right:0; }
    .summary-label { color:#303437; font-size:12px; display:flex; align-items:center; gap:5px; white-space:nowrap; }
    .summary-label svg { width:15px; height:15px; }
    .summary-value { color:var(--teal); font-weight:900; font-size:20px; line-height:1; }
    .summary-value.warn { color:var(--amber); }
    dialog { border:0; border-radius:12px; padding:0; width:min(92vw,420px); box-shadow:0 24px 70px rgba(0,0,0,.22); }
    dialog::backdrop { background:rgba(13,21,21,.36); }
    .modal { padding:18px; display:grid; gap:12px; }
    .modal h2 { margin:0; font-size:20px; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .actions { display:flex; justify-content:flex-end; gap:8px; margin-top:4px; }
    @media (min-width: 760px) {
      body { padding:22px; }
      .phone { min-height:calc(100vh - 44px); border-radius:26px; }
      .summary, .fab-wrap { bottom:22px; }
      .summary { border-radius:0 0 26px 26px; }
    }
    @media (max-width: 390px) {
      .table-head, .stock-row { grid-template-columns: 28px minmax(112px,1fr) 42px 44px 70px; gap:5px; }
      .material { grid-template-columns: 44px 1fr; gap:8px; }
      .emoji { width:42px; height:47px; font-size:27px; }
      .item-name { font-size:14px; }
      .stepper { grid-template-columns:32px 32px; gap:6px; }
      .step { width:32px; height:34px; }
      .tab { font-size:12px; gap:5px; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="status">
      <span>9:41</span>
      <div class="status-icons" aria-hidden="true">
        <span class="signal"><i></i><i></i><i></i><i></i></span>
        <svg width="18" height="14" viewBox="0 0 24 18" fill="none"><path d="M2 6.8c5.8-5 14.2-5 20 0M5.8 10.5c3.6-3.1 8.8-3.1 12.4 0M9.3 14.1a4 4 0 0 1 5.4 0" stroke="currentColor" stroke-width="2.7" stroke-linecap="round"/></svg>
        <span class="battery"></span>
      </div>
    </div>
    <header class="appbar">
      <button class="icon-button" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="title">Estudio Stock</div>
      <button class="icon-button" id="scanButton" aria-label="Escanear codigo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M7 3H4v4M17 3h3v4M7 21H4v-4M20 17v4h-3M7 8v8M10 8v8M13 8v8M16 8v8"/></svg>
      </button>
    </header>
    <nav class="tabs" aria-label="Secciones">
      <button class="tab active" data-mode="stock">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 5h6M9 4a3 3 0 0 1 6 0M6 7h12v14H6zM9 11h6M9 15h4"/></svg>
        Stock
      </button>
      <button class="tab" data-mode="alerts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 17h.01"/></svg>
        Alertas
      </button>
      <button class="tab" data-mode="buy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 6h15l-2 8H8zM6 6 5 3H2M9 20a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM18 20a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/></svg>
        Compra
      </button>
      <button class="tab" data-mode="moves">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v6h6M12 7v6l4 2"/></svg>
        Movimientos
      </button>
    </nav>
    <main>
      <div class="search-row">
        <label class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M16 16l5 5"/></svg>
          <input id="search" placeholder="Buscar material...">
        </label>
        <button class="filter-button" id="toggleFilter" aria-label="Filtros">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 5h18l-7 8v5l-4 2v-7z"/></svg>
        </button>
      </div>
      <div class="filter-panel" id="filterPanel">
        <select class="field" id="category"><option value="all">Todas las categorias</option></select>
      </div>
      <div class="toolbar" id="toolbar">
        <button class="secondary" id="selectAll" type="button">Seleccionar todo</button>
        <button class="danger" id="deleteSelected" type="button">Borrar seleccion</button>
      </div>
      <p class="mode-note" id="modeNote"></p>
      <div class="table-head" id="tableHead">
        <div></div>
        <div>Material</div>
        <div>Stock</div>
        <div>Min.</div>
        <div></div>
      </div>
      <div id="list"></div>
    </main>
    <div class="fab-wrap">
      <span class="fab-label">Nuevo material</span>
      <button class="fab" id="openItem" aria-label="Nuevo material">+</button>
    </div>
    <footer class="summary">
      <div class="summary-item">
        <div class="summary-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="#c47a00" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 17h.01"/></svg>
          Bajo
        </div>
        <div class="summary-value warn" id="lowCount">0</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12l-8 8-9-9V3h8z"/><circle cx="8" cy="8" r="1"/></svg>
          Valor
        </div>
        <div class="summary-value" id="stockValue">0 EUR</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v6h6M12 7v6l4 2"/></svg>
          Hoy
        </div>
        <div class="summary-value" id="movesToday">0</div>
      </div>
    </footer>
  </div>

  <dialog id="itemDialog">
    <form class="modal" method="dialog" id="itemForm">
      <h2>Nuevo material</h2>
      <input class="field" name="emoji" placeholder="Emoji foto" value="🧴" maxlength="4">
      <input class="field" name="name" placeholder="Nombre" required>
      <input class="field" name="variant" placeholder="Detalle / medida">
      <div class="form-grid">
        <input class="field" name="qty" type="number" step="0.1" placeholder="Stock" required>
        <input class="field" name="unit" placeholder="Unidad" value="und">
        <input class="field" name="min" type="number" step="0.1" placeholder="Minimo" value="1">
        <input class="field" name="price" type="number" step="0.01" placeholder="Coste unidad" value="0">
      </div>
      <input class="field" name="category" placeholder="Categoria" value="Material">
      <div class="actions">
        <button class="secondary" value="cancel" type="button" id="closeItem">Cancelar</button>
        <button class="primary" value="default">Guardar</button>
      </div>
    </form>
  </dialog>

  <dialog id="ticketDialog">
    <form class="modal" method="dialog" id="ticketForm">
      <h2>Registrar ticket</h2>
      <select class="field" name="provider">
        <option value="atomx">AtomX</option>
        <option value="vega">Vega Tattoo</option>
      </select>
      <button class="secondary" id="ocrTicket" type="button">Leer ticket con camara / imagen</button>
      <textarea class="field" name="lines" rows="8" placeholder="Una linea por producto:&#10;Cartuchos 1203RL x2 13,92&#10;Dynamic TBK 240 ml 1 38,72"></textarea>
      <p class="mode-note" style="margin:0">El ticket aprende precios del proveedor y suma unidades si encuentra el producto.</p>
      <div class="actions">
        <button class="secondary" value="cancel" type="button" id="closeTicket">Cancelar</button>
        <button class="primary" value="default">Guardar ticket</button>
      </div>
    </form>
  </dialog>

  <script>
    const STORAGE = 'estudioStock.v2.clean';
    const emptyState = { items: [], moves: [], prices: {}, selected: [], mode: 'stock' };
    const state = { ...emptyState, ...JSON.parse(localStorage.getItem(STORAGE) || '{}') };
    const euro = new Intl.NumberFormat('es-ES', { maximumFractionDigits: 0 });

    function save() {
      localStorage.setItem(STORAGE, JSON.stringify({
        items: state.items,
        moves: state.moves,
        prices: state.prices,
        mode: state.mode
      }));
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char]));
    }

    function normalizeText(value) {
      return String(value || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function displayName(item) { return item.name || 'Material'; }
    function displaySub(item) { return [item.variant, item.category, item.unit].filter(Boolean).join(' · '); }
    function missingQty(item) { return Math.max(0, Number(item.min || 0) - Number(item.qty || 0)); }
    function priceFor(id, provider) { return Number(state.prices[id]?.[provider] || 0); }

    function moveItem(id, delta, reason = 'Ajuste manual') {
      const item = state.items.find(entry => entry.id === id);
      if (!item) return;
      item.qty = Math.max(0, Number((Number(item.qty || 0) + delta).toFixed(2)));
      state.moves.unshift({ id: crypto.randomUUID(), item: displayName(item), delta, reason, at: new Date().toISOString() });
      save();
      render();
    }

    function filteredItems() {
      const query = normalizeText(document.querySelector('#search').value);
      const category = document.querySelector('#category').value;
      return state.items.filter(item => {
        const haystack = normalizeText(`${item.name} ${item.variant} ${item.category} ${item.unit}`);
        return haystack.includes(query) && (category === 'all' || item.category === category);
      });
    }

    function itemsToBuy() {
      return state.items.filter(item => missingQty(item) > 0);
    }

    function renderStock() {
      const list = document.querySelector('#list');
      const items = filteredItems();
      document.querySelector('#tableHead').style.display = 'grid';
      list.className = '';
      list.innerHTML = items.length ? items.map(item => {
        const isLow = Number(item.qty || 0) <= Number(item.min || 0);
        const checked = state.selected.includes(item.id) ? 'checked' : '';
        return `
          <article class="stock-row">
            <input class="check" type="checkbox" ${checked} onchange="toggleSelected('${item.id}', this.checked)" aria-label="Seleccionar ${escapeHtml(displayName(item))}">
            <div class="material">
              <div class="emoji">${escapeHtml(item.emoji || '📦')}</div>
              <div>
                <div class="item-name">${escapeHtml(displayName(item))}</div>
                <div class="item-sub">${escapeHtml(displaySub(item))}</div>
              </div>
            </div>
            <div class="stock">${escapeHtml(item.qty)}</div>
            <div class="min ${isLow ? 'low' : ''}">${escapeHtml(item.min)}</div>
            <div class="stepper">
              <button class="step" onclick="moveItem('${item.id}', -1)">-</button>
              <button class="step" onclick="moveItem('${item.id}', 1)">+</button>
            </div>
          </article>
        `;
      }).join('') : '<div class="empty">Inventario limpio. Pulsa + para crear el primer material.</div>';
    }

    function renderAlerts() {
      const list = document.querySelector('#list');
      const items = filteredItems().filter(item => Number(item.qty || 0) <= Number(item.min || 0));
      document.querySelector('#tableHead').style.display = 'grid';
      list.className = '';
      list.innerHTML = items.length ? items.map(item => {
        const checked = state.selected.includes(item.id) ? 'checked' : '';
        const missing = missingQty(item);
        return `
          <article class="stock-row">
            <input class="check" type="checkbox" ${checked} onchange="toggleSelected('${item.id}', this.checked)" aria-label="Seleccionar ${escapeHtml(displayName(item))}">
            <div class="material">
              <div class="emoji">${escapeHtml(item.emoji || '⚠️')}</div>
              <div>
                <div class="item-name">${escapeHtml(displayName(item))}</div>
                <div class="item-sub">Faltan ${missing} ${escapeHtml(item.unit || 'und')} · minimo ${escapeHtml(item.min)}</div>
              </div>
            </div>
            <div class="stock">${escapeHtml(item.qty)}</div>
            <div class="min low">${escapeHtml(item.min)}</div>
            <div class="stepper">
              <button class="step" onclick="moveItem('${item.id}', -1)">-</button>
              <button class="step" onclick="moveItem('${item.id}', 1)">+</button>
            </div>
          </article>
        `;
      }).join('') : '<div class="empty">Todo esta por encima del minimo.</div>';
    }

    function renderBuy() {
      const list = document.querySelector('#list');
      const items = itemsToBuy().filter(item => filteredItems().includes(item));
      document.querySelector('#tableHead').style.display = 'none';
      list.className = 'cards';
      list.innerHTML = items.length ? items.map(item => {
        const missing = missingQty(item);
        const atomx = priceFor(item.id, 'atomx');
        const vega = priceFor(item.id, 'vega');
        const best = atomx && vega ? (atomx <= vega ? 'atomx' : 'vega') : atomx ? 'atomx' : vega ? 'vega' : '';
        return `
          <article class="card">
            <div>
              <h2>${escapeHtml(item.emoji || '📦')} ${escapeHtml(displayName(item))}</h2>
              <p>Comprar ${missing} ${escapeHtml(item.unit || 'und')} para llegar a minimo ${escapeHtml(item.min)}</p>
            </div>
            <div class="price-grid">
              <div class="price-box ${best === 'atomx' ? 'best' : ''}">
                <label>AtomX ${best === 'atomx' ? '· mejor' : ''}</label>
                <input type="number" min="0" step="0.01" value="${atomx || ''}" placeholder="Precio" onchange="setProviderPrice('${item.id}','atomx',this.value)">
                <small>${atomx ? `${euro.format(atomx * missing)} EUR total` : 'Sin precio'}</small>
              </div>
              <div class="price-box ${best === 'vega' ? 'best' : ''}">
                <label>Vega ${best === 'vega' ? '· mejor' : ''}</label>
                <input type="number" min="0" step="0.01" value="${vega || ''}" placeholder="Precio" onchange="setProviderPrice('${item.id}','vega',this.value)">
                <small>${vega ? `${euro.format(vega * missing)} EUR total` : 'Sin precio'}</small>
              </div>
            </div>
          </article>
        `;
      }).join('') : '<div class="empty">No hay materiales por debajo del minimo.</div>';
    }

    function renderMoves() {
      const list = document.querySelector('#list');
      document.querySelector('#tableHead').style.display = 'none';
      list.className = 'cards';
      list.innerHTML = state.moves.length ? state.moves.map(move => `
        <article class="card">
          <h2>${escapeHtml(move.item)}</h2>
          <p>${escapeHtml(move.reason)} - ${new Date(move.at).toLocaleString('es-ES')}</p>
          <strong>${move.delta > 0 ? '+' : ''}${escapeHtml(move.delta)}</strong>
        </article>
      `).join('') : '<div class="empty">Todavia no hay movimientos.</div>';
    }

    function renderCategories() {
      const select = document.querySelector('#category');
      const selected = select.value || 'all';
      const categories = [...new Set(state.items.map(item => item.category).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'es'));
      select.innerHTML = '<option value="all">Todas las categorias</option>' + categories.map(category => `<option>${escapeHtml(category)}</option>`).join('');
      select.value = categories.includes(selected) ? selected : 'all';
    }

    function renderSummary() {
      const low = state.items.filter(item => Number(item.qty || 0) <= Number(item.min || 0)).length;
      const value = state.items.reduce((sum, item) => sum + Number(item.qty || 0) * Number(item.price || 0), 0);
      const today = new Date().toDateString();
      const moves = state.moves.filter(move => new Date(move.at).toDateString() === today).length;
      document.querySelector('#lowCount').textContent = low;
      document.querySelector('#stockValue').textContent = `${euro.format(value)} EUR`;
      document.querySelector('#movesToday').textContent = moves;
    }

    function renderToolbar() {
      document.querySelector('#toolbar').classList.toggle('hidden', state.mode === 'moves');
      document.querySelector('#modeNote').textContent = {
        stock: 'Selecciona materiales para borrarlos o ajusta stock con + y -.',
        alerts: 'Solo materiales en minimo o por debajo. Sube stock con + o revisa compra.',
        buy: 'Lista de compra segun minimo. Los precios se aprenden con tickets o los puedes escribir.',
        moves: 'Historial local de cambios.'
      }[state.mode];
    }

    function render() {
      document.querySelectorAll('.tab').forEach(tab => tab.classList.toggle('active', tab.dataset.mode === state.mode));
      renderCategories();
      renderToolbar();
      if (state.mode === 'stock') renderStock();
      if (state.mode === 'alerts') renderAlerts();
      if (state.mode === 'buy') renderBuy();
      if (state.mode === 'moves') renderMoves();
      renderSummary();
    }

    function toggleSelected(id, checked) {
      state.selected = checked ? [...new Set([...state.selected, id])] : state.selected.filter(entry => entry !== id);
      renderToolbar();
    }

    function setProviderPrice(id, provider, value) {
      state.prices[id] = state.prices[id] || {};
      state.prices[id][provider] = Number(value || 0);
      save();
      render();
    }

    function selectAllVisible() {
      const ids = filteredItems().map(item => item.id);
      const allSelected = ids.length && ids.every(id => state.selected.includes(id));
      state.selected = allSelected ? state.selected.filter(id => !ids.includes(id)) : [...new Set([...state.selected, ...ids])];
      render();
    }

    function deleteSelected() {
      if (!state.selected.length) return;
      if (!confirm(`Borrar ${state.selected.length} materiales seleccionados?`)) return;
      const deleted = new Set(state.selected);
      state.items = state.items.filter(item => !deleted.has(item.id));
      state.selected = [];
      save();
      render();
    }

    function findStockItem(text) {
      const needle = normalizeText(text);
      let best = null;
      let bestScore = 0;
      state.items.forEach(item => {
        const parts = [item.name, item.variant, item.category].filter(Boolean).map(normalizeText);
        let score = 0;
        parts.forEach(part => {
          if (part && needle.includes(part)) score += Math.min(10, part.length / 3);
          part.split(/[^a-z0-9]+/).filter(token => token.length > 2).forEach(token => {
            if (needle.includes(token)) score += 1;
          });
        });
        if (score > bestScore) { best = item; bestScore = score; }
      });
      return bestScore >= 3 ? best : null;
    }

    function parseTicketLine(line) {
      const clean = line.trim();
      if (!clean) return null;
      const priceMatch = clean.match(/(\d+[,.]\d{1,2}|\d+)\s*(?:€|eur)?\s*$/i);
      if (!priceMatch) return { name: clean, qty: 1, price: 0 };
      const price = Number(priceMatch[1].replace(',', '.'));
      const beforePrice = clean.slice(0, priceMatch.index).trim();
      const qtyMatch = beforePrice.match(/(?:x\s*(\d+(?:[,.]\d+)?)|(\d+(?:[,.]\d+)?)\s*(?:uds?|unidades|cajas?|packs?|rollos?|ml|l)?)\s*$/i);
      const qty = qtyMatch ? Number((qtyMatch[1] || qtyMatch[2]).replace(',', '.')) : 1;
      const name = qtyMatch ? beforePrice.slice(0, qtyMatch.index).trim() : beforePrice;
      return { name: name || beforePrice || clean, qty: qty || 1, price };
    }

    function registerTicket(provider, text) {
      const lines = text.split(/\r?\n/).map(parseTicketLine).filter(Boolean);
      let matched = 0;
      lines.forEach(line => {
        const item = findStockItem(line.name);
        if (item) {
          state.prices[item.id] = state.prices[item.id] || {};
          state.prices[item.id][provider] = line.price;
          item.qty = Number((Number(item.qty || 0) + Number(line.qty || 0)).toFixed(2));
          matched += 1;
          state.moves.unshift({ id: crypto.randomUUID(), item: displayName(item), delta: line.qty, reason: `Ticket ${provider} - ${line.price} EUR`, at: new Date().toISOString() });
        } else {
          state.moves.unshift({ id: crypto.randomUUID(), item: line.name, delta: line.qty, reason: `Ticket ${provider} sin enlazar - ${line.price} EUR`, at: new Date().toISOString() });
        }
      });
      save();
      state.mode = 'moves';
      render();
      alert(`Ticket guardado. ${matched} de ${lines.length} lineas enlazadas al stock.`);
    }

    function prepareOrders() {
      const groups = { atomx: [], vega: [], pendiente: [] };
      itemsToBuy().forEach(item => {
        const missing = missingQty(item);
        const atomx = priceFor(item.id, 'atomx');
        const vega = priceFor(item.id, 'vega');
        const line = `${item.emoji || '📦'} ${displayName(item)} - ${missing} ${item.unit || 'und'}`;
        if (atomx && vega) groups[atomx <= vega ? 'atomx' : 'vega'].push(line);
        else if (atomx) groups.atomx.push(line);
        else if (vega) groups.vega.push(line);
        else groups.pendiente.push(line);
      });
      const text = ['ATOMX', ...groups.atomx.map(x => `- ${x}`), '', 'VEGA TATTOO', ...groups.vega.map(x => `- ${x}`), '', 'SIN PRECIO', ...groups.pendiente.map(x => `- ${x}`)].join('\n');
      navigator.clipboard?.writeText(text).catch(() => {});
      alert(text || 'No hay compra pendiente.');
    }

    function loadTesseract() {
      if (window.Tesseract) return Promise.resolve();
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
        script.onload = resolve;
        script.onerror = reject;
        document.head.appendChild(script);
      });
    }

    async function ocrTicketToTextarea() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.capture = 'environment';
      input.click();
      await new Promise(resolve => input.addEventListener('change', resolve, { once: true }));
      const file = input.files?.[0];
      if (!file) return;
      const textarea = document.querySelector('#ticketForm textarea[name="lines"]');
      textarea.value = 'Leyendo ticket...';
      try {
        await loadTesseract();
        const result = await Tesseract.recognize(file, 'spa+eng');
        textarea.value = result.data.text.trim();
      } catch {
        textarea.value = '';
        alert('No he podido leer el ticket. Prueba con mas luz o una foto mas recta.');
      }
    }

    document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => { state.mode = tab.dataset.mode; save(); render(); }));
    document.querySelector('#search').addEventListener('input', render);
    document.querySelector('#category').addEventListener('change', render);
    document.querySelector('#toggleFilter').addEventListener('click', () => document.querySelector('#filterPanel').classList.toggle('open'));
    document.querySelector('#selectAll').addEventListener('click', selectAllVisible);
    document.querySelector('#deleteSelected').addEventListener('click', deleteSelected);
    document.querySelector('#openItem').addEventListener('click', () => document.querySelector('#itemDialog').showModal());
    document.querySelector('#closeItem').addEventListener('click', () => document.querySelector('#itemDialog').close());
    document.querySelector('#itemForm').addEventListener('submit', event => {
      event.preventDefault();
      const data = new FormData(event.currentTarget);
      const item = {
        id: crypto.randomUUID(),
        emoji: data.get('emoji') || '📦',
        name: data.get('name'),
        variant: data.get('variant') || '',
        qty: Number(data.get('qty')),
        unit: data.get('unit') || 'und',
        min: Number(data.get('min')),
        price: Number(data.get('price')),
        category: data.get('category') || 'Material'
      };
      state.items.push(item);
      state.moves.unshift({ id: crypto.randomUUID(), item: displayName(item), delta: item.qty, reason: 'Nuevo material', at: new Date().toISOString() });
      save();
      event.currentTarget.reset();
      document.querySelector('#itemDialog').close();
      render();
    });
    document.querySelector('#scanButton').addEventListener('click', () => {
      const code = prompt('Escaneo de codigo: escribe o pega el codigo del producto.');
      if (code) {
        document.querySelector('#search').value = code;
        state.mode = 'stock';
        render();
      }
    });
    document.querySelector('#openTicket')?.addEventListener('click', () => document.querySelector('#ticketDialog').showModal());
    document.querySelector('#closeTicket').addEventListener('click', () => document.querySelector('#ticketDialog').close());
    document.querySelector('#ocrTicket').addEventListener('click', ocrTicketToTextarea);
    document.querySelector('#ticketForm').addEventListener('submit', event => {
      event.preventDefault();
      const data = new FormData(event.currentTarget);
      registerTicket(data.get('provider'), data.get('lines') || '');
      event.currentTarget.reset();
      document.querySelector('#ticketDialog').close();
    });

    const buyActions = document.createElement('div');
    buyActions.className = 'toolbar';
    buyActions.id = 'buyActions';
    buyActions.innerHTML = '<button class="primary" id="openTicket" type="button">Ticket OCR</button><button class="secondary" id="prepareOrders" type="button">Preparar compra</button>';
    document.querySelector('#modeNote').after(buyActions);
    document.querySelector('#openTicket').addEventListener('click', () => document.querySelector('#ticketDialog').showModal());
    document.querySelector('#prepareOrders').addEventListener('click', prepareOrders);

    const originalRenderToolbar = renderToolbar;
    renderToolbar = function() {
      originalRenderToolbar();
      document.querySelector('#buyActions').classList.toggle('hidden', state.mode !== 'buy');
    };

    render();
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
